<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Länder finden – Country Guesser</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/find-countries.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="./" aria-label="Zurück zum Menü">← Menü</a>
    <h1>Länder finden</h1>
    <dl class="stats">
      <div><dt><span class="stat-dot mastered" aria-hidden="true"></span><span class="label-long">Gemeistert</span></dt><dd id="stat-mastered">0</dd></div>
      <div><dt><span class="stat-dot started" aria-hidden="true"></span><span class="label-long">Begonnen</span></dt><dd id="stat-started">0</dd></div>
      <div><dt><span class="stat-dot never" aria-hidden="true"></span><span class="label-long">Noch nie gefragt</span></dt><dd id="stat-never">0</dd></div>
    </dl>
    <div class="progress" id="progress" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <button type="button" id="settings-btn" class="icon-button" aria-label="Einstellungen" aria-haspopup="dialog" title="Einstellungen">⚙&#xFE0E;</button>
  </header>

  <main class="map-wrap" id="map-wrap">
    <canvas id="map" role="img" aria-label="Globus"></canvas>
    <canvas id="map-target" aria-hidden="true"></canvas>
    <div class="tooltip" id="tooltip" hidden></div>
    <ul class="legend" id="legend" aria-label="Legende"></ul>
    <p class="loading" id="loading">Karte wird geladen …</p>
  </main>

  <section class="panel">
    <div class="answer">
      <p class="prompt" id="prompt" tabindex="-1" aria-live="polite">Wo liegt <strong id="prompt-name">…</strong>?</p>
      <button type="button" id="next-btn" class="primary" disabled>Weiter</button>
      <button type="button" id="dont-know-btn" aria-label="Weiß ich nicht" title="Weiß ich nicht" disabled><span class="label-long">Weiß ich nicht</span><span class="label-short" aria-hidden="true">?</span></button>
    </div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <p id="storage-notice" class="notice" hidden>Hinweis: Der Fortschritt kann in diesem Browser nicht gespeichert werden.</p>
  </section>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Einstellungen</h2>
    <label class="setting">Kontinent
      <select id="continent-filter">
        <option value="">Alle</option>
      </select>
    </label>
    <p class="setting-group">Fortschritt</p>
    <div class="setting-actions">
      <button type="button" id="export-btn">Exportieren</button>
      <button type="button" id="import-btn">Importieren</button>
      <button type="button" id="reset-btn">Zurücksetzen</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button type="button" id="settings-close" class="primary">Fertig</button>
  </dialog>
</body>
</html>
