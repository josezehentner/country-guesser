<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="title.borders">Grenzgänger – Country Guesser</title>
  <link rel="icon" href="data:,">
  <script src="src/language-boot.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/borders.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="./" aria-label="Zurück zum Menü" data-i18n="back" data-i18n-aria-label="backLabel">← Menü</a>
    <h1 data-i18n="mode.borders">Grenzgänger</h1>
    <dl class="stats">
      <div><dt><span class="stat-dot solved" aria-hidden="true"></span><span class="label-long" data-i18n="stat.solved">Gelöst</span></dt><dd id="stat-solved">0</dd></div>
      <div><dt><span class="stat-dot perfect" aria-hidden="true"></span><span class="label-long" data-i18n="stat.perfect">Kürzester Weg</span></dt><dd id="stat-perfect">0</dd></div>
      <div><dt><span class="stat-dot streak" aria-hidden="true"></span><span class="label-long" data-i18n="stat.streak">Serie</span></dt><dd id="stat-streak">0</dd></div>
    </dl>
    <div class="progress" id="progress" role="progressbar" aria-label="Anteil gelöster Runden" data-i18n-aria-label="progress.rounds" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <button type="button" id="help-btn" class="icon-button" aria-label="Spielanleitung" aria-haspopup="dialog" title="Spielanleitung" data-i18n-aria-label="help" data-i18n-title="help">?</button>
    <button type="button" id="settings-btn" class="icon-button" aria-label="Einstellungen" aria-haspopup="dialog" title="Einstellungen" data-i18n-aria-label="settings" data-i18n-title="settings">⚙&#xFE0E;</button>
  </header>

  <div class="play-area">
  <aside id="filters" class="filters" aria-labelledby="filters-title">
    <h2 id="filters-title" data-i18n="filters">Filter</h2>
    <fieldset>
      <legend data-i18n="filters.regions">Regionen</legend>
      <div id="region-filters" class="filter-options"></div>
    </fieldset>
    <p id="filter-summary" class="filter-summary" aria-live="polite"></p>
  </aside>
  <button type="button" id="filters-btn" class="filters-tab" aria-label="Filter" aria-controls="filters" aria-expanded="false" title="Filter" data-i18n-aria-label="filters" data-i18n-title="filters"><span class="tab-arrow" aria-hidden="true"></span><span class="tab-label" aria-hidden="true" data-i18n="filters">Filter</span></button>
  <main class="map-wrap" id="map-wrap">
    <canvas id="map" role="img" aria-label="Globus ohne Grenzen" data-i18n-aria-label="map.globeNoBorders"></canvas>
    <canvas id="map-target" aria-hidden="true"></canvas>
    <button type="button" id="recenter-btn" class="recenter" aria-label="Ziel und Start zeigen" title="Ziel und Start zeigen" data-i18n-aria-label="recenter.route" data-i18n-title="recenter.route" hidden><svg class="recenter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><circle class="recenter-dot" cx="12" cy="12" r="2"/><path d="M12 1.5v4.5M12 18v4.5M1.5 12H6M18 12h4.5"/></svg><span class="recenter-label" data-i18n="recenter.routeShort">Ziel &amp; Start</span></button>
    <div class="caption route-caption" id="prompt">
      <p class="route-ends"><span id="route-from">Von</span> <strong id="route-start" class="route-end-name start"></strong> <span id="route-to">nach</span> <strong id="route-end" class="route-end-name end"></strong></p>
      <p class="route-status" id="route-status"></p>
    </div>
    <ol class="route-guesses" id="route-guesses" aria-label="Genannte Länder" data-i18n-aria-label="route.guesses"></ol>
    <p class="loading" id="loading" data-i18n="loading">Karte wird geladen …</p>
  </main>
  </div>

  <section class="panel">
    <form id="answer-form" class="answer" autocomplete="off">
      <label for="answer-input" class="visually-hidden" data-i18n="answer.route">Land auf dem Weg</label>
      <input id="answer-input" type="text" placeholder="Land auf dem Weg …" data-i18n-placeholder="placeholder.route"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" disabled>
      <button type="submit" id="submit-btn" class="primary" disabled data-i18n="check">Prüfen</button>
      <button type="button" id="dont-know-btn" aria-label="Weiß ich nicht" title="Weiß ich nicht" data-i18n-aria-label="dontKnow" data-i18n-title="dontKnow" disabled><span class="label-long" data-i18n="dontKnow">Wei<span class="eszett">ß</span> ich nicht</span><span class="label-short" aria-hidden="true">?</span></button>
    </form>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <p id="storage-notice" class="notice" hidden data-i18n="storageNotice">Hinweis: Der Fortschritt kann in diesem Browser nicht gespeichert werden.</p>
  </section>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <h2 id="settings-title" data-i18n="settings">Einstellungen</h2>
    <p class="setting-group" id="language-label" data-i18n="settings.language">Sprache</p>
    <div class="language-switch" role="group" aria-labelledby="language-label">
      <button type="button" data-language="de" lang="de" aria-pressed="false">Deutsch</button>
      <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
    </div>
    <p class="setting-group" data-i18n="settings.progress">Fortschritt</p>
    <div class="setting-actions">
      <button type="button" id="export-btn" data-i18n="settings.export">Exportieren</button>
      <button type="button" id="import-btn" data-i18n="settings.import">Importieren</button>
      <button type="button" id="reset-btn" data-i18n="settings.reset">Zurücksetzen</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button type="button" id="settings-close" class="primary" data-i18n="settings.done">Fertig</button>
  </dialog>
</body>
</html>
