<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="color-scheme" content="light dark">
  <title>Länder-Quiz</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Länder-Quiz</h1>
    <dl class="stats">
      <div><dt>Gemeistert</dt><dd id="stat-mastered">0</dd></div>
      <div><dt>Begonnen</dt><dd id="stat-started">0</dd></div>
      <div><dt>Noch nie gefragt</dt><dd id="stat-never">0</dd></div>
    </dl>
    <div class="progress" id="progress" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </header>

  <main class="map-wrap" id="map-wrap">
    <svg id="map" viewBox="0 0 1000 520" role="img" aria-label="Weltkarte"></svg>
    <svg id="map-target" viewBox="0 0 1000 520" aria-hidden="true"></svg>
    <div class="tooltip" id="tooltip" hidden></div>
    <ul class="legend" id="legend" aria-label="Legende"></ul>
    <p class="loading" id="loading">Karte wird geladen …</p>
  </main>

  <section class="panel">
    <form id="answer-form" class="answer" autocomplete="off">
      <label for="answer-input" class="visually-hidden">Name des markierten Landes</label>
      <input id="answer-input" type="text" placeholder="Wie heißt das markierte Land?"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" disabled>
      <button type="submit" id="submit-btn" class="primary" disabled>Prüfen</button>
      <button type="button" id="dont-know-btn" disabled>Weiß ich nicht</button>
    </form>
    <p id="feedback" class="feedback" aria-live="polite"></p>

    <div class="tools">
      <label>Kontinent
        <select id="continent-filter">
          <option value="">Alle</option>
        </select>
      </label>
      <button type="button" id="export-btn">Exportieren</button>
      <button type="button" id="import-btn">Importieren</button>
      <button type="button" id="reset-btn">Zurücksetzen</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <p id="storage-notice" class="notice" hidden>Hinweis: Der Fortschritt kann in diesem Browser nicht gespeichert werden.</p>
  </section>
</body>
</html>
